<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fardel</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b0d10; color: #e8eaed;
    }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    h1 { font-size: 2.5rem; letter-spacing: 0.04em; margin: 0 0 0.5rem; font-weight: 650; }
    p { line-height: 1.55; color: #a8b0bc; margin: 0.75rem 0; }
    .tag { display: inline-block; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: #8b9cff; border: 1px solid #2a3350; padding: 0.35rem 0.65rem; border-radius: 999px; margin-bottom: 1.25rem; }
    a { color: #9db0ff; }
    code { font-size: 0.9em; color: #cdd3dc; }
  </style>
</head>
<body>
  <main>
    <div class="tag">play.sparkify.dev</div>
    <h1>Fardel</h1>
    <p>Your pack is your build. Browser MMORPG placeholder — Unity WebGPU client lands here.</p>
    <p>Preview DB: <code>dev-db.sparkify.dev</code> · Docs: <a href="https://github.com/antonybstack/fardel">github.com/antonybstack/fardel</a></p>
  </main>
</body>
</html>
