# Fardel agent-seat layout (Mac Studio / any host that also serves prod).
# Sourced by seat-lib.sh. Override locally with seats.local.conf (gitignored).
#
# PROD / preview (NEVER allocated to agents):
#   SpacetimeDB 0.0.0.0:3000  data ~/.local/share/spacetime/data  db fardel
#   cloudflared  dev-db.sparkify.dev → http://127.0.0.1:3000
#   Pages        play.sparkify.dev (Cloudflare; not local Vite)
#   Human Vite   127.0.0.1:5173 (lead checkout only)

FARDEL_PROD_STDB_PORT=3000
FARDEL_PROD_VITE_PORT=5173
FARDEL_PROD_DB=fardel
FARDEL_PROD_STDB_DATA_DEFAULT="$HOME/.local/share/spacetime/data"

# Pool sizes — 12 developers + 8 QA covers 6+4 with headroom.
# Bump these; keep DEV_STDB_BASE + DEV_SLOTS < QA_STDB_BASE.
FARDEL_DEV_SLOTS=12
FARDEL_QA_SLOTS=8

# Agent ports sit far from 3000 / 5173 so a default `spacetime start` cannot
# be mistaken for a seat, and so seats cannot steal prod/lead listeners.
FARDEL_DEV_STDB_BASE=3200
FARDEL_DEV_VITE_BASE=5200
FARDEL_DEV_CDP_BASE=9300
FARDEL_QA_STDB_BASE=3240
FARDEL_QA_VITE_BASE=5240
FARDEL_QA_CDP_BASE=9340

# Worktrees: $HOME/dev/wt/<slug> (stable even when scripts run FROM a worktree).
# Do not derive this as parent(checkout)/wt — that nests ~/dev/wt/wt when the
# agent already lives at ~/dev/wt/dev-1.
# Linux box overlay: FARDEL_WT_ROOT=/workspace/wt in seats.local.conf
# FARDEL_WT_ROOT=
# FARDEL_LEAD_ROOT=   # release checkout (play.sparkify.dev pipeline)
# FARDEL_CLAIM_ROOT=
# FARDEL_ARTIFACT_ROOT=
