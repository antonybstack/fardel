name: Feel / UX observation
description: Control, camera, feedback, or polish note (not necessarily a hard bug)
title: "[feel] "
labels: ["feel"]
body:
  - type: markdown
    attributes:
      value: |
        Capture how it *feels* in play — friction, delight gaps, or polish targets.
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What you noticed while playing or reviewing.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: P0 = blocks feel of core loop; P1 = strong friction; P2 = polish.
      options:
        - P0
        - P1
        - P2
      default: 1
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where / when (scene, input mode, host). Optional.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / clips
      description: |
        Link visual evidence (strongly preferred for feel issues).
        
        Use https://ve.sparkify.dev for screenshots (upload via tools/scripts/ve-upload.sh).
        Lead or QA Feel will host VE when filing or verifying.
        
        Do NOT rely solely on GitHub drag-drop paste for long-term VE.
      placeholder: |
        ![feel-issue](https://ve.sparkify.dev/feel-123/observation.png)
        
        or drag images here as interim (but prefer ve.sparkify.dev links)
    validations:
      required: false
  - type: textarea
    id: suggested
    attributes:
      label: Suggested direction
      description: Optional idea for a fix or experiment — not a full design.
    validations:
      required: false
