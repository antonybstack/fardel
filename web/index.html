<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fardel</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <canvas id="minimap" width="160" height="160" aria-label="Minimap"></canvas>
    <div id="spellHotbar" aria-label="Spell hotbar">
      <div class="spellSlot" id="slotSpark" data-spell="spark">
        <div class="slotSweep" id="sweepSpark"></div>
        <div class="slotCast" id="castSpark"></div>
        <span class="slotKey">1</span>
        <span class="slotName">Spark</span>
      </div>
      <div class="spellSlot" id="slotEmberbolt" data-spell="emberbolt">
        <div class="slotSweep" id="sweepEmberbolt"></div>
        <div class="slotCast" id="castEmberbolt"></div>
        <span class="slotKey">2</span>
        <span class="slotName">Emberbolt</span>
      </div>
    </div>
    <div id="selfFrame" class="hidden" aria-label="Player self frame">
      <div class="sfNameRow">
        <span id="sfName">You</span>
        <span id="sfXp" class="sfXp">XP —</span>
      </div>
      <div class="sfHint">GCD on hotbar · B bag</div>
    </div>
    <div id="loadoutStrip" class="hidden" aria-label="Loadout strip">
      <div class="loChip" id="loStaff" data-kind="staff">
        <span class="loIcon staff" aria-hidden="true">┃</span>
        <span class="loLabel">Staff</span>
        <span class="loState" id="loStaffState">—</span>
      </div>
      <div class="loChip" id="loRobes" data-kind="robes">
        <span class="loIcon robes" aria-hidden="true">▣</span>
        <span class="loLabel">Robes</span>
        <span class="loState" id="loRobesState">—</span>
      </div>
      <div class="loChip" id="loSpark" data-kind="spark">
        <span class="loIcon spark" aria-hidden="true">✦</span>
        <span class="loLabel">Spark</span>
        <span class="loState" id="loSparkState">—</span>
      </div>
      <div class="loChip" id="loEmber" data-kind="emberbolt">
        <span class="loIcon ember" aria-hidden="true">✸</span>
        <span class="loLabel">Emberbolt</span>
        <span class="loState" id="loEmberState">—</span>
      </div>
    </div>
    <div id="bagPanel" class="hidden" aria-label="Bag / loadout">
      <div class="bagHead">
        <span class="bagTitle">Bag / loadout</span>
        <span class="bagKey">B</span>
      </div>
      <div class="bagRow"><span>Staff</span><span id="bagStaff">—</span></div>
      <div class="bagRow"><span>Robes</span><span id="bagRobes">—</span></div>
      <div class="bagRow"><span>Spark</span><span id="bagSpark">—</span></div>
      <div class="bagRow"><span>Emberbolt</span><span id="bagEmber">—</span></div>
      <div class="bagRow"><span>XP</span><span id="bagXp">—</span></div>
      <div class="bagFoot">Casts need staff + known spell · U/I staff · J/K robes</div>
    </div>
    <div id="combatLog" aria-label="Combat log">
      <div class="clHead">Combat log</div>
      <div id="combatLogLines" class="clLines"></div>
    </div>
    <div id="hud">
      <div id="status">Booting…</div>
      <div id="persistMark" class="persistMark"></div>
      <div id="partyFrames" class="hidden" aria-label="Party member frames"></div>
      <div id="targetFrame" class="hidden" aria-label="Selected target">
        <div class="tfNameRow">
          <span id="tfName">—</span>
          <span id="tfId" class="tfId"></span>
        </div>
        <div class="tfHpBar">
          <div class="tfHpFill" id="tfHpFill"></div>
          <span class="tfHpLabel" id="tfHpLabel">—</span>
        </div>
      </div>
      <div id="combatBars">
        <div class="bar" id="gcdBar">
          <div class="barFill" id="gcdFill"></div>
          <span class="barLabel" id="gcdLabel">GCD —</span>
        </div>
        <div class="bar hidden" id="castBar">
          <div class="barFill cast" id="castFill"></div>
          <span class="barLabel" id="castLabel">—</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
